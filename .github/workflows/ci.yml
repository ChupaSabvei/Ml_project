name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tracked files, Python syntax and notebooks
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          local_dirs = {"data", "artifacts", "outputs", "checkpoints", ".venv", "venv"}
          errors = []
          tracked = subprocess.check_output(["git", "ls-files", "-z"])
          for filename in tracked.split(b"\0"):
              if not filename:
                  continue
              path = Path(os.fsdecode(filename))
              if path.parts[0] in local_dirs or (
                  path.name != ".env.example"
                  and (path.name == ".env" or path.name.startswith(".env."))
              ):
                  errors.append(f"{path}: local file must stay outside Git")
                  continue
              try:
                  if path.suffix == ".py":
                      compile(path.read_bytes(), str(path), "exec")
                  elif path.suffix == ".ipynb":
                      notebook = json.loads(path.read_text(encoding="utf-8"))
                      if notebook["nbformat"] != 4 or not isinstance(notebook["cells"], list):
                          raise ValueError("expected a notebook in nbformat 4")
                      for number, cell in enumerate(notebook["cells"], 1):
                          if cell["cell_type"] == "code" and (
                              cell["outputs"] or cell["execution_count"] is not None
                          ):
                              errors.append(f"{path}: clear outputs and execution count in cell {number}")
              except (OSError, ValueError, SyntaxError, KeyError, TypeError) as error:
                  errors.append(f"{path}: {error}")
          if errors:
              raise SystemExit("\n".join(errors))
          PY
      - name: Run Python unit tests when present
        run: |
          if [ -d tests ] && find tests -name 'test_*.py' -print -quit | grep -q .; then
            if [ -f requirements.txt ]; then
              python3 -m venv .venv
              . .venv/bin/activate
              python3 -m pip install -r requirements.txt
            fi
            python3 -m unittest discover -s tests -v
          fi
